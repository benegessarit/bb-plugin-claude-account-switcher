review_guidelines = """
This BB plugin releases a selected Claude Code runtime after verifying Claude.ai authentication on the exact machine.
Prioritize incorrect state transitions, active-session interruption, cancellation races, credential or terminal-output exposure, host-lock leaks, unsafe helper cleanup, and tests that do not exercise the public plugin contract.
Do not report style-only findings, speculative architecture, or publication suggestions without a concrete correctness, security, packaging, or reviewability defect.
"""
